<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Turn the Bottle Around | Institutional Botanical Archive · Kalyani Ma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C08;
  --bg-card:#0B140E;
  --bg-card-subtle:#0F1A12;
  --bg-input:#060A07;
  --text-main:#E4E8E3;
  --text-muted:#A6B0A7;
  --text-dim:#7D877E;
  --accent-gold:#CBB279;
  --accent-gold-d:#917D50;
  --accent-gold-light:#EFE6CF;
  --border:#1A261D;
  --border-light:#293A2D;
  --border-gold:rgba(203,178,121,0.28);
  --section-divider:2px solid rgba(203,178,121,0.26);
  --green-badge:#152B1E;
  --green-text:#52B77C;
  --alert-red:#E06464;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html, body{
  margin:0;
  padding:0;
  width:100%;
  background:var(--bg);
  color:var(--text-main);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.75;
  font-size:18.5px;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
h1,h2,h3{
  line-height:1.22;
  margin:0 0 .5em;
  overflow-wrap:break-word;
  text-wrap:balance;
  font-family:'Newsreader',Georgia,Cambria,serif;
  font-weight:500;
  letter-spacing:-0.01em;
}
.font-cinzel{
  font-family:'Cinzel',serif;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.font-mono{
  font-family:'JetBrains Mono',monospace;
}
p{margin:0 0 1em;overflow-wrap:break-word}
a{color:var(--accent-gold);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent-gold-light);text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* Top Navigation Bar */
.top-nav{
  border-bottom:var(--section-divider);
  padding:18px 0;
  background:rgba(7,12,8,0.95);
  width:100%;
}
.top-nav .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand-meta{
  display:flex;
  flex-direction:column;
}
.brand-meta .inst{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--text-dim);
  text-transform:uppercase;
  margin-bottom:2px;
}
.brand-meta .name{
  font-family:'Newsreader',Georgia,serif;
  font-size:20px;
  color:var(--text-main);
  font-weight:600;
}
.status-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  padding:4px 12px;
  background:var(--green-badge);
  border:1px solid rgba(82,183,124,0.3);
  color:var(--green-text);
  border-radius:20px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.status-pill::before{
  content:"";
  width:6px;
  height:6px;
  background:var(--green-text);
  border-radius:50%;
  display:inline-block;
}

/* Primary Button Styling */
.btn-blueprint{
  font-family:'Plus Jakarta Sans',sans-serif;
  display:inline-block;
  background:var(--accent-gold);
  color:#0B140E !important;
  font-weight:700;
  font-size:16px;
  padding:15px 28px;
  border-radius:4px;
  border:1px solid var(--accent-gold);
  cursor:pointer;
  text-decoration:none !important;
  box-shadow:0 4px 18px rgba(203,178,121,0.22);
  transition:all .15s ease;
  text-align:center;
}
.btn-blueprint:hover{
  background:#dfca96;
  transform:translateY(-1px);
}

/* Hero Section */
.hero{
  padding:64px 0 72px;
  border-bottom:var(--section-divider);
  background:radial-gradient(circle at 80% 20%, rgba(26,45,30,0.4) 0%, rgba(7,12,8,0) 65%);
}
.hero .wrap{
  display:grid;
  grid-template-columns:1fr;
  gap:44px;
  align-items:center;
}
.badge-tag{
  display:inline-flex;
  align-items:center;
  background:var(--bg-card-subtle);
  border:1px solid var(--border-gold);
  color:var(--accent-gold);
  font-size:11.5px;
  font-family:'Cinzel',serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:5px 12px;
  border-radius:3px;
  margin-bottom:20px;
}
.hero h1{
  font-size:clamp(32px,5.2vw,50px);
  color:#fff;
  font-weight:500;
  line-height:1.18;
  margin-bottom:20px;
}
.hero h1 span{
  color:var(--accent-gold);
  font-style:italic;
  font-weight:400;
}
