<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Partner Field Portal &bull; Kalyani Ma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #070f0b;
      color: #f7f2e7;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%;
      max-width: 540px;
      padding: 40px 32px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(22, 39, 30, 0.96) 0%, rgba(11, 22, 16, 0.99) 100%);
      border: 1px solid rgba(203, 178, 121, 0.45);
      border-top: 1px solid rgba(242, 202, 118, 0.8);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
    }
    .crest {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 1.5px solid #cbb279;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cinzel", Georgia, serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #cbb279;
      letter-spacing: 0.5px;
    }
    .kicker {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cbb279;
      margin-bottom: 10px;
      font-weight: 600;
    }
    h1 {
      font-family: "Cinzel", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: #f7f2e7;
      margin-bottom: 12px;
    }
    p {
      font-family: "Newsreader", Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #c8d3cc;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="crest">KM</div>
    <div class="kicker">Keeper of the Botanical Archive</div>
    <h1>Partner Link Generator</h1>
    <p>Field sharing tools and custom referral link generation are being prepared here.</p>
  </main>
</body>
</html>
